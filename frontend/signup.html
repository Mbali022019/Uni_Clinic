<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniClinic — Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background:#eef2f7;">

<div class="auth-shell">

  <!-- ═══ LEFT PANEL ═══ -->
  <div class="auth-left">
    <div class="auth-left-inner">

      <div class="auth-logo-box">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>

      <div class="auth-brand">UniClinic</div>
      <div class="auth-tagline">Your campus health partner.<br>Access quality healthcare services anytime, anywhere.</div>

      <div class="auth-stats">
        <div class="auth-stat">
          <span class="auth-stat-val">5,000+</span>
          <span class="auth-stat-label">Students Served</span>
        </div>
        <div class="auth-stat">
          <span class="auth-stat-val">15+</span>
          <span class="auth-stat-label">Health Services</span>
        </div>
        <div class="auth-stat">
          <span class="auth-stat-val">24/7</span>
          <span class="auth-stat-label">Support</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══ RIGHT PANEL ═══ -->
  <div class="auth-right">
    <div class="auth-card">

      <div class="auth-card-title">Create Account</div>
      <div class="auth-card-sub">Join UniClinic to manage your health</div>

      <!-- Full Name -->
      <div class="field">
        <label class="field-label">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" placeholder="John Doe" />
        </div>
      </div>

      <!-- Student / Staff Number -->
      <div class="field">
        <label class="field-label">Student / Staff Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
          </span>
          <input type="text" placeholder="e.g. 202512345" />
        </div>
      </div>

      <!-- Email + Contact (side by side) -->
      <div class="field-row">
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Email</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" placeholder="name@uni.ac.za" />
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Contact Number</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 13 19.79 19.79 0 0 1 1.05 4.4 2 2 0 0 1 3 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 17"/></svg>
            </span>
            <input type="tel" placeholder="012 345 6789" />
          </div>
        </div>
      </div>

      <!-- Password + Confirm (side by side) -->
      <div class="field-row" style="margin-top:18px;">
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="pw1" placeholder="Create password" />
            <button class="input-icon-right" onclick="togglePw('pw1','eye1')" type="button">
              <svg id="eye1" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="pw2" placeholder="Confirm password" />
            <button class="input-icon-right" onclick="togglePw('pw2','eye2')" type="button">
              <svg id="eye2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <div style="margin-top:26px;">
        <a href="dashboard.html" class="btn btn-primary btn-full">Create Account</a>
      </div>

      <div class="auth-footer-text">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

    </div>
  </div>

</div>

<script>
  function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
</script>

</body>
</html>
