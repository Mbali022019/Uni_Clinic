<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>UniClinic — Sign In</title>

  <link rel="stylesheet" href="css/login.css"/>

</head>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:#eef2f7;
  min-height:100vh;
}

.auth-shell{
  display:flex;
  min-height:100vh;
}

.auth-left{
  width:42%;
  background:linear-gradient(135deg,#0f766e,#14b8a6);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px;
}

.auth-left-inner{
  max-width:420px;
}

.auth-logo-box{
  width:72px;
  height:72px;
  border-radius:22px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:30px;
  backdrop-filter:blur(12px);
}

.auth-brand{
  font-size:42px;
  font-weight:800;
  margin-bottom:18px;
}

.auth-tagline{
  line-height:1.7;
  color:rgba(255,255,255,.9);
  font-size:16px;
  margin-bottom:45px;
}

.auth-stats{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.auth-stat{
  padding:18px;
  border-radius:20px;
  background:rgba(255,255,255,.1);
  min-width:120px;
}

.auth-stat-val{
  display:block;
  font-size:22px;
  font-weight:700;
}

.auth-stat-label{
  font-size:13px;
}

.auth-right{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.auth-card{
  width:100%;
  max-width:560px;
  background:white;
  border-radius:32px;
  padding:45px;
  box-shadow:0 10px 40px rgba(15,23,42,.08);
}

.auth-card-title{
  font-size:34px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:10px;
}

.auth-card-sub{
  color:#64748b;
  margin-bottom:35px;
}

.field{
  margin-bottom:22px;
}

.field-label{
  display:block;
  margin-bottom:10px;
  font-size:14px;
  font-weight:600;
  color:#334155;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
}

.input-icon-right{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:none;
  cursor:pointer;
  color:#94a3b8;
}

.input-wrap input{
  width:100%;
  height:58px;
  border-radius:16px;
  border:1.5px solid #dbe4ee;
  background:#f8fafc;
  padding:0 48px;
  font-size:15px;
}

.input-wrap input:focus,
.select-wrap select:focus{
  outline:none;
  border-color:#14b8a6;
  background:white;
  box-shadow:0 0 0 4px rgba(20,184,166,.12);
}

.select-wrap select{
  width:100%;
  height:58px;
  border-radius:16px;
  border:1.5px solid #dbe4ee;
  background:#f8fafc;
  padding:0 18px;
  font-size:15px;
  cursor:pointer;
}

.remember-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0;
}

.remember-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}

.btn{
  border:none;
  cursor:pointer;
}

.btn-primary{
  background:#14b8a6;
  color:white;
}

.btn-primary:hover{
  background:#0f766e;
}

.btn-full{
  width:100%;
  height:58px;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
}

.btn-ghost{
  border:none;
  background:none;
  color:#14b8a6;
  cursor:pointer;
  font-weight:600;
}

.auth-footer-text{
  margin-top:28px;
  text-align:center;
  font-size:14px;
  color:#64748b;
}

.auth-footer-text a{
  color:#14b8a6;
  text-decoration:none;
  font-weight:700;
}

.popup{
  position:fixed;
  top:30px;
  right:30px;
  background:white;
  border-radius:16px;
  padding:18px 22px;
  min-width:280px;
  box-shadow:0 10px 35px rgba(0,0,0,.1);
  transform:translateX(120%);
  transition:.35s;
  z-index:9999;
}

.popup.show{
  transform:translateX(0);
}

.popup.success{
  border-left:5px solid #10b981;
}

.popup.error{
  border-left:5px solid #ef4444;
}

@media(max-width:980px){

  .auth-left{
    display:none;
  }

  .auth-right{
    padding:20px;
  }

  .auth-card{
    padding:30px;
  }

}
</style>

<body>

<div class="auth-shell">

  <!-- LEFT -->
  <div class="auth-left">

    <div class="auth-left-inner">

      <div class="auth-logo-box">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="white"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>

      <div class="auth-brand">
        UniClinic
      </div>

      <div class="auth-tagline">
        Your campus health partner.<br>
        Access quality healthcare services anytime, anywhere.
      </div>

      <div class="auth-stats">

        <div class="auth-stat">
          <span class="auth-stat-val">5,000+</span>
          <span class="auth-stat-label">Students Served</span>
        </div>

        <div class="auth-stat">
          <span class="auth-stat-val">15+</span>
          <span class="auth-stat-label">Health Services</span>
        </div>

        <div class="auth-stat">
          <span class="auth-stat-val">24/7</span>
          <span class="auth-stat-label">Support</span>
        </div>

      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="auth-right">

    <div class="auth-card">

      <div class="auth-card-title">
        Welcome Back
      </div>

      <div class="auth-card-sub">
        Sign in to access your UniClinic dashboard
      </div>

      <form id="loginForm">

        <!-- LOGIN -->
        <div class="field">

          <label class="field-label">
            Email or Student Number
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4
                c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              </svg>
            </span>

            <input
              type="text"
              id="loginInput"
              placeholder="name@uni.ac.za or 202512345"
              required
            />

          </div>

        </div>

        <!-- PASSWORD -->
        <div class="field">

          <label class="field-label">
            Password
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11"
                  rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />

            <button
              class="input-icon-right"
              type="button"
              id="togglePassword">

              <svg id="eyeIcon" width="16" height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>

              </svg>

            </button>

          </div>

        </div>

        <!-- ROLE -->
        <div class="field">

          <label class="field-label">
            Login As
          </label>

          <div class="select-wrap">

            <select id="roleSelect" required>
              <option value="">
                Loading roles...
              </option>
            </select>

          </div>

        </div>

        <!-- REMEMBER -->
        <div class="remember-row">

          <label class="remember-box">
            <input type="checkbox">
            <span>Remember me</span>
          </label>

          <button class="btn-ghost" type="button">
            Forgot Password?
          </button>

        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="btn btn-primary btn-full"
          id="loginBtn">

          Sign In

        </button>

      </form>

      <!-- FOOTER -->
      <div class="auth-footer-text">

        Don't have an account?

        <a href="signup.html">
          Create one
        </a>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../JavaScript/supabase.js"></script>

<script src="../JavaScript/login.js"></script>

</body>
</html>
