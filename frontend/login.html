<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniClinic — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background:#eef2f7;">

<div class="auth-shell">

  <!-- ═══ LEFT PANEL ═══ -->
  <div class="auth-left">
    <div class="auth-left-inner">
      <div class="auth-logo-box">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <div class="auth-brand">UniClinic</div>
      <div class="auth-tagline">Your campus health partner.<br>Access quality healthcare services anytime, anywhere.</div>
      <div class="auth-stats">
        <div class="auth-stat">
          <span class="auth-stat-val">5,000+</span>
          <span class="auth-stat-label">Students Served</span>
        </div>
        <div class="auth-stat">
          <span class="auth-stat-val">15+</span>
          <span class="auth-stat-label">Health Services</span>
        </div>
        <div class="auth-stat">
          <span class="auth-stat-val">24/7</span>
          <span class="auth-stat-label">Support</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ RIGHT PANEL ═══ -->
  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-card-title">Welcome Back</div>
      <div class="auth-card-sub">Sign in to access your UniClinic dashboard</div>

      <!-- EMAIL -->
      <div class="field">
        <label class="field-label">Email or Student Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            </svg>
          </span>
          <input type="text" placeholder="name@uni.ac.za or 202512345" />
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="pw" placeholder="Enter your password" />
          <button class="input-icon-right" onclick="togglePw('pw','eyeIcon')" type="button">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ROLE SELECTION -->
      <div class="field" style="margin-top:24px;">
        <label class="field-label">Login As</label>
        <div class="role-selector">
          <label class="role-card active-role">
            <input type="radio" name="role" checked>
            <div class="role-badge"></div>
            <div class="role-icon patient-role">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div>
              <div class="role-title">Patient</div>
              <div class="role-sub">Students & Staff</div>
            </div>
          </label>

          <label class="role-card">
            <input type="radio" name="role">
            <div class="role-badge"></div>
            <div class="role-icon nurse-role">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 2h8"/>
                <path d="M12 2v20"/>
                <path d="M5 12h14"/>
              </svg>
            </div>
            <div>
              <div class="role-title">Nurse</div>
              <div class="role-sub">Clinic Staff</div>
            </div>
          </label>

          <label class="role-card">
            <input type="radio" name="role">
            <div class="role-badge"></div>
            <div class="role-icon admin-role">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m6.08 0l4.24-4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m6.08 0l4.24 4.24"/>
              </svg>
            </div>
            <div>
              <div class="role-title">Admin</div>
              <div class="role-sub">System Manager</div>
            </div>
          </label>
        </div>
      </div>

      <!-- REMEMBER + FORGOT -->
      <div class="remember-row" style="margin-top:18px;">
        <label class="remember-box">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <button class="btn-ghost">Forgot Password?</button>
      </div>

      <!-- BUTTON -->
      <div style="margin-top:18px;">
        <a href="dashboard.html" class="btn btn-primary btn-full">Sign In</a>
      </div>

      <!-- FOOTER -->
      <div class="auth-footer-text">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

</div>

<script>
  function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  document.querySelectorAll('input[name="role"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.querySelectorAll('.role-card').classList.remove('active-role');
      radio.closest('.role-card').classList.add('active-role');
    });
  });
</script>

</body>
</html>
